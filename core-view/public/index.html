<!DOCTYPE html>
<!-- Factory Core View — каркас приложения (исполнитель B).
     Пассивный наблюдатель за заводом saga-mcp: только чтение, никаких кнопок
     управления. Плаха «PROJECTION» висит всегда — проекция не авторитет.
     Контракт полей: core-view/SPEC.md. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Core View — ядро завода</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%2322d3ee'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./core.css">
  <link rel="stylesheet" href="./views/chain.css">
  <link rel="stylesheet" href="./views/tape.css">
</head>
<body class="core-body">
  <div id="core-app" class="core-app">

    <header class="core-header">
      <div class="core-brand">
        <span class="core-brand-reactor" aria-hidden="true"></span>
        <span class="core-brand-name">CORE&nbsp;VIEW</span>
        <span class="core-brand-sub">ядро завода</span>
      </div>

      <div class="core-project">
        <label class="core-project-label" for="core-project-select">Проект</label>
        <select id="core-project-select" class="core-project-select" title="Смена проекта снапшота (core:select-project)"></select>
      </div>

      <nav class="core-tabs" id="core-tabs" aria-label="Виды">
        <button class="core-tab" data-view="pulse" type="button">Пульс</button>
        <button class="core-tab" data-view="chain" type="button">Цепочка</button>
        <button class="core-tab" data-view="cell"  type="button">Ячейка</button>
        <button class="core-tab" data-view="tape"  type="button">Хроника</button>
      </nav>

      <div class="core-header-right">
        <span id="core-pulse-dot" class="core-pulse-dot p-unknown"
              title="свежесть активности завода (pulse.lastActivityAt)">●</span>
        <span id="core-clock" class="core-clock" title="местное время оператора">--:--:--</span>
        <span class="core-banner" title="Проекция объясняет, но не авторизует переходы (§27 ментальной модели)">
          PROJECTION — наблюдение, не авторитет
        </span>
      </div>
    </header>

    <div class="core-statusline">
      <span id="core-conn" class="core-conn conn-boot">подключение…</span>
      <span class="core-statusline-sep" aria-hidden="true">·</span>
      <span id="core-project-name" class="core-project-name">проект: —</span>
      <span class="core-statusline-sep" aria-hidden="true">·</span>
      <span id="core-facts" class="core-facts"></span>
      <span class="core-statusline-spacer"></span>
      <span id="core-flash" class="core-flash"></span>
    </div>

    <main class="core-main">
      <section class="core-view" id="core-view-pulse" hidden></section>
      <section class="core-view" id="core-view-chain" hidden></section>
      <section class="core-view" id="core-view-cell"  hidden></section>
      <section class="core-view" id="core-view-tape"  hidden></section>
    </main>

    <footer class="core-footer">
      <span>snapshot 1&nbsp;с · projects 5&nbsp;с · события 1&nbsp;с</span>
      <span class="core-statusline-spacer"></span>
      <span>только GET · read-only · :4323</span>
    </footer>

  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

name: Process Module Compatibility Patch

on:
  push:
    branches:
      - agent/saga3-process-modules

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saga3-process-modules
      - name: Apply exact compatibility patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/engines/saga3-discovery-engine.ts')
          source = path.read_text(encoding='utf-8')
          old = "      const concluded = rt.readConcludedIntentWithProposal(epicId, DISCOVERY_INTENT_KIND);"
          new = """      // Compatibility boundary: the concluded-intent recovery lookup was added
          // after several external/fake runtime adapters already implemented the port.
          // Production SQLite implements it; older adapters may omit it. Missing support
          // means only that this optional recovery optimization is unavailable — normal
          // open-intent creation remains valid and must not abort the entire process.
          const concluded = typeof rt.readConcludedIntentWithProposal === 'function'
            ? rt.readConcludedIntentWithProposal(epicId, DISCOVERY_INTENT_KIND)
            : null;"""
          if new in source:
              print('patch already applied')
          else:
              if old not in source:
                  raise SystemExit('expected engine line not found; refusing broad patch')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines/saga3-discovery-engine.ts
          git commit -m "fix(discovery): tolerate legacy runtime adapters in recovery lookup"
          git push origin HEAD:agent/saga3-process-modules

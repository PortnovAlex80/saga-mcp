name: CI

on:
  push:
    branches: [dev, main, saga2-refactoring, saga4]
  pull_request:
    branches: [dev, main, saga2-refactoring, saga4]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: TypeScript build (type-check + emit dist/ for the acceptance matrix)
        # CI-03: the acceptance matrix runs `node --test` on *.mjs that import
        # from dist/, so dist/ MUST be emitted (not just --noEmit type-checked).
        run: npm run build

      - name: ESLint (blocking lint gate)
        # CI-01: lint is a BLOCKING acceptance gate. No allow-failure /
        # continue-on-error / retries hide errors.
        run: npx eslint src/

      # ------------------------------------------------------------------
      # CI-02 - the deterministic acceptance matrix.
      #
      # EK-8 HARD CUTOVER (WP-12, 2026-08-26): the matrix is the post-cutover
      # set - the event-projected kernel suites, the 20-project corpus, the
      # architecture ratchets (re-pinned), the surviving KEEP tooling tests
      # and the EK guard groups. The legacy groups died with the purge; every
      # step below is blocking, isolated, no hidden failures, no retries.
      # ------------------------------------------------------------------

      - name: Matrix - EK workflow-kernel suites
        # The EK greenfield kernel + the EK-8 production composition tests:
        # model, persistence, roles, engine, application, context envelope,
        # development vertical, projection, workshops, composition laws.
        run: node tools/run-acceptance-matrix.mjs --group workflow-kernel

      - name: Matrix - EK project-corpus suites
        # WP-13D: scripted project corpus + elite-kit replay tests.
        run: node tools/run-acceptance-matrix.mjs --group project-corpus

      - name: Matrix - architecture invariants (ADR-053 gates, ratchets)
        run: node tools/run-acceptance-matrix.mjs --group architecture

      - name: Matrix - kept tooling (ADR registry, build receipt, shim guards)
        # The KEEP classes of the EK-8 purge.
        run: node tools/run-acceptance-matrix.mjs --group kept-tooling

      - name: cgad-spec-lint unit suite
        run: node --test tools/cgad-spec-lint.test.mjs

      - name: Completion-evidence validation
        # P0-02 evidence contract over docs/factory/COMPLETION-LEDGER.md
        # (pure doc validation; survived the purge).
        run: node tools/validate-completion-evidence.mjs

      - name: Matrix - CC proof-hosting registry (CC-U1 / ADR-092)
        run: node tools/run-acceptance-matrix.mjs --group cc-proof-registry

      - name: Matrix - EK-1 deletion-manifest stop-gate
        # POST-CUTOVER shape (WP-12): V1 is inverted for DELETE - every
        # classified-at-base DELETE file that still exists is V1-SURVIVOR red
        # (resurrection is a red build); KEEP/RETAIN entries must exist.
        run: node tools/run-acceptance-matrix.mjs --group ek-manifest-guard

      - name: Matrix - EK-1 admission-spec validator (blocking)
        run: node tools/run-acceptance-matrix.mjs --group ek-admission

      - name: Matrix - EK removal guards (WP-13C post-cutover shape)
        # RG1 mandatory-DELETE members absent / residuals present; RG2 the
        # old tables are NOT creatable; RG3 the deletion sets are executed;
        # RG4 legacy-zero --strict exits 0.
        run: node tools/run-acceptance-matrix.mjs --group ek-removal-guard

      - name: EK legacy-zero laws (post-cutover --strict)
        # The five legacy-zero laws (every deletion-manifest entry absent;
        # production imports resolve only to the new runtime; forbidden old
        # table names absent from production SQL; no migration/adoption/
        # compatibility fallback; no workshop-owned scheduler/state DDL).
        # WP-12 flipped THIS step from --check to --strict at the hard
        # cutover: any surviving or resurrected legacy reference is a red
        # build from that moment on.
        run: node tools/ek-legacy-zero.mjs --strict

      - name: Matrix - EK mutation coverage (kernel kill claims)
        run: node tools/run-acceptance-matrix.mjs --group ek-mutation-coverage

      - name: Matrix - EK elite-evidence-kit determinism smoke
        run: node tools/run-acceptance-matrix.mjs --group ek-evidence-kit

      - name: Matrix - coverage & no-hidden-failure guard
        # CI-02 self-check (runs last): asserts the matrix covers every
        # required deterministic suite, quarantines the pre-existing-red file
        # with a reason, and that ci.yml hides no failure (no `|| true`, no
        # continue-on-error, no blanket npm test).
        run: node tools/run-acceptance-matrix.mjs --group matrix-coverage

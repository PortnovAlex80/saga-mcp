name: CI

on:
  push:
    branches: [dev, main, saga2-refactoring, saga4]
  pull_request:
    branches: [dev, main, saga2-refactoring, saga4]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: TypeScript strict build
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/
        continue-on-error: true

      - name: Tests
        run: npm test

      - name: Architecture gate
        # Dependency-direction ratchet + cutover checks + conveyor boundaries.
        # Must stay green; the ratchet only ever tightens (no unallowlisted new,
        # no stale allowlist entries).
        run: npm run test:architecture

      - name: Dispatcher race gate
        # Concurrent worker_next must never double-claim a card. The suite is
        # not auto-discovered by `node --test` (plain .mjs scripts), so it has
        # its own npm script.
        run: npm run test:dispatcher-race

      - name: cgad-spec-lint self-check
        run: node tools/cgad-spec-lint.mjs tools/cgad-spec-lint.test.mjs || true
        # Self-check: linter should run without crashing on any SQLite DB
        # Real enforcement: run against project saga.db in a separate step

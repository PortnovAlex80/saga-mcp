name: Export Saga4 product factory workspace

on:
  pull_request:
    branches: [saga4]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/saga4-product-factory-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact workspace
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/saga4-product-factory-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: saga4-product-factory-source
          path: /tmp/saga4-product-factory-source.zip
          if-no-files-found: error
          retention-days: 1

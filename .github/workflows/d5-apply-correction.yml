name: D5 Apply Correction

on:
  push:
    branches:
      - d5-discovery-diagnosis
    paths:
      - tools/d5-review-correction.b64.02
      - .github/workflows/d5-apply-correction.yml
  pull_request:
    branches:
      - saga3-discovery
    paths:
      - tools/d5-review-correction.b64.02
      - .github/workflows/d5-apply-correction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: d5-discovery-diagnosis
          fetch-depth: 0
      - name: Guard payload
        id: payload
        shell: bash
        run: |
          if [[ -f tools/d5-review-correction.b64.00 && -f tools/d5-review-correction.b64.01 && -f tools/d5-review-correction.b64.02 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct and apply correction
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          cat tools/d5-review-correction.b64.00 \
              tools/d5-review-correction.b64.01 \
              tools/d5-review-correction.b64.02 \
            | base64 --decode | gzip --decompress > /tmp/d5-correction.patch
          git apply --check --exclude=.github/workflows/d5-review.yml /tmp/d5-correction.patch
          git apply --index --exclude=.github/workflows/d5-review.yml /tmp/d5-correction.patch
          git rm tools/d5-review-correction.b64.00 \
                 tools/d5-review-correction.b64.01 \
                 tools/d5-review-correction.b64.02
      - name: Setup Node
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: npm ci
      - name: TypeScript
        if: steps.payload.outputs.present == 'true'
        run: npx tsc --noEmit
      - name: Architecture
        if: steps.payload.outputs.present == 'true'
        run: npm run build && node --test tests/saga3/*architecture*.test.mjs
      - name: D5 focused tests
        if: steps.payload.outputs.present == 'true'
        run: |
          node --test \
            tests/saga3/d5-certificate-bundle.test.mjs \
            tests/saga3/d5-diagnosis-case.test.mjs \
            tests/saga3/d5-diagnosis-validator.test.mjs \
            tests/saga3/d5-diagnosis-persistence.test.mjs \
            tests/saga3/d5-diagnosis-service.test.mjs \
            tests/saga3/d5-diagnosis-engine.test.mjs \
            tests/saga3/d5-adversarial.test.mjs \
            tests/saga3/d5-diagnosis-integrity.test.mjs \
            tests/saga3/d5-controlled-reject-smoke.test.mjs
      - name: Commit and push correction
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "fix(saga3-d5): close integrity review and downstream tests"
          git push origin HEAD:d5-discovery-diagnosis

name: D5 Finalize Documentation

on:
  pull_request:
    branches:
      - saga3-discovery
    paths:
      - tools/finalize-d5-docs.py
      - .github/workflows/d5-finalize-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: d5-discovery-diagnosis
          fetch-depth: 0
      - name: Apply final evidence corrections
        if: hashFiles('tools/finalize-d5-docs.py') != ''
        run: |
          python tools/finalize-d5-docs.py
          git rm tools/finalize-d5-docs.py
      - name: Commit and push documentation
        if: hashFiles('tools/finalize-d5-docs.py') == ''
        run: echo "documentation script already consumed"
      - name: Publish corrected documentation
        shell: bash
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/saga3/D5-TEST-MATRIX.md docs/saga3/D5-TODO.md docs/saga3/D5-REVIEW-AUDIT.md
          git commit -m "docs(saga3-d5): record corrected final evidence audit"
          git push origin HEAD:d5-discovery-diagnosis

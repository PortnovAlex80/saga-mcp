name: D5 Review

on:
  push:
    branches:
      - d5-discovery-diagnosis
  pull_request:
    branches:
      - saga3-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Architecture
        run: npm run build && node --test tests/saga3/*architecture*.test.mjs
      - name: D5 focused tests
        id: d5_focused
        continue-on-error: true
        shell: bash
        run: |
          node --test \
            tests/saga3/d5-certificate-bundle.test.mjs \
            tests/saga3/d5-diagnosis-case.test.mjs \
            tests/saga3/d5-diagnosis-validator.test.mjs \
            tests/saga3/d5-diagnosis-persistence.test.mjs \
            tests/saga3/d5-diagnosis-service.test.mjs \
            tests/saga3/d5-diagnosis-engine.test.mjs \
            tests/saga3/d5-adversarial.test.mjs \
            tests/saga3/d5-diagnosis-integrity.test.mjs \
            tests/saga3/d5-controlled-reject-smoke.test.mjs \
            > d5-focused.log 2>&1
      - name: Upload D5 focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-focused-log
          path: d5-focused.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail on focused test failure
        if: steps.d5_focused.outcome == 'failure'
        run: |
          tail -n 180 d5-focused.log
          exit 1
      - name: Full suite
        id: full_suite
        continue-on-error: true
        shell: bash
        run: npm test > full-suite.log 2>&1
      - name: Upload full suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-log
          path: full-suite.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail on full suite failure
        if: steps.full_suite.outcome == 'failure'
        run: |
          tail -n 220 full-suite.log
          exit 1

name: D5 Review

on:
  push:
    branches:
      - d5-discovery-diagnosis
  pull_request:
    branches:
      - saga3-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Architecture
        run: npm run build && node --test tests/saga3/*architecture*.test.mjs
      - name: D5 focused tests
        id: focused
        shell: bash
        run: |
          set +e
          node --test \
            tests/saga3/d5-certificate-bundle.test.mjs \
            tests/saga3/d5-diagnosis-case.test.mjs \
            tests/saga3/d5-diagnosis-validator.test.mjs \
            tests/saga3/d5-diagnosis-persistence.test.mjs \
            tests/saga3/d5-diagnosis-service.test.mjs \
            tests/saga3/d5-diagnosis-engine.test.mjs \
            tests/saga3/d5-adversarial.test.mjs \
            > d5-focused.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat d5-focused.log
          exit 0
      - name: Package review workspace
        if: always()
        run: tar --exclude=.git -czf /tmp/d5-review-workspace.tgz .
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-focused-log
          path: d5-focused.log
          if-no-files-found: error
          retention-days: 5
      - name: Upload review workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-review-workspace
          path: /tmp/d5-review-workspace.tgz
          if-no-files-found: error
          retention-days: 2
      - name: Fail on focused test errors
        if: steps.focused.outputs.exit_code != '0'
        run: exit 1
      - name: Full suite
        if: success()
        run: npm test

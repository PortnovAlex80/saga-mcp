name: Agent source export

on:
  pull_request:
    branches: [saga4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source snapshot
        run: |
          git archive --format=zip --output=saga4-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: saga4-source
          path: saga4-source.zip
          if-no-files-found: error
          retention-days: 1

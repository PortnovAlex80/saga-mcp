name: Apply Saga4 cutover patch

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  apply:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.issue.pull_request && startsWith(github.event.comment.body, 'SAGA4_PATCH_READY '))
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout PR head
        shell: bash
        run: |
          set -euo pipefail
          head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')"
          git fetch origin "refs/heads/${head_ref}:refs/remotes/origin/${head_ref}"
          git checkout -B "${head_ref}" "origin/${head_ref}"
          echo "BRANCH_NAME=${head_ref}" >> "$GITHUB_ENV"
      - name: Reassemble and apply patch
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > /tmp/comments.json
          jq -r '
            [ .[]
              | select(.body | test("^SAGA4_PATCH_[0-9]{2}/[0-9]{2}\\n"))
            ]
            | sort_by(.body[12:14])
            | map(.body | split("\n")[1])
            | join("")
          ' /tmp/comments.json > /tmp/saga4-cutover.patch.xz.b64
          test -s /tmp/saga4-cutover.patch.xz.b64
          base64 --decode /tmp/saga4-cutover.patch.xz.b64 > /tmp/saga4-cutover.patch.xz
          echo "b8df737e899c1d5a9cb3abb5a6fe60a06c79e482091d0e07ab081eaa0db13e0c  /tmp/saga4-cutover.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/saga4-cutover.patch.xz > /tmp/saga4-cutover.patch
          git apply --binary --index /tmp/saga4-cutover.patch
          rm -f .github/workflows/agent-source-export.yml
          git add -A
          git diff --cached --check
          git config user.name "Saga4 Cutover Bot"
          git config user.email "saga4-cutover@users.noreply.github.com"
          git commit -m "refactor: make Saga4 startup durable and fail-closed"
          git push origin "HEAD:${BRANCH_NAME}"
      - name: Scrub transport comments
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("SAGA4_PATCH_")) | .id' \
          | while read -r comment_id; do
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                -f body='Saga4 cutover transport payload consumed and removed.' >/dev/null
            done

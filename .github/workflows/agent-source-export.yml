name: Apply Saga4 cutover patch

on:
  pull_request:
    branches: [saga4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent-payload/ready ]]; then
            echo "No ready payload; nothing to apply."
            exit 0
          fi
          base64 --decode .agent-payload/saga4-cutover.patch.gz.b64 | gzip --decompress > /tmp/saga4-cutover.patch
          git apply --binary --index /tmp/saga4-cutover.patch
          rm -rf .agent-payload
          rm -f .github/workflows/agent-source-export.yml
          git add -A
          git diff --cached --check
          git config user.name "Saga4 Cutover Bot"
          git config user.email "saga4-cutover@users.noreply.github.com"
          git commit -m "refactor: establish clean Saga4 authority boundaries"
          git push origin "HEAD:${BRANCH_NAME}"

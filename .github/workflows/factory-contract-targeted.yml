name: Factory Contract Targeted

on:
  push:
    branches:
      - agent/replay-zero-scripted-final
  pull_request:
    branches:
      - saga4
  workflow_dispatch:

jobs:
  canonical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply replay authority rebinding experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/infrastructure/replay/capsule-replay-executor.ts')
          s = p.read_text()
          import_needle = "import { deserializeWorkplaceRef } from '../../process-modules/domain/workplace/workplace-ref.js';"
          if import_needle not in s:
              raise SystemExit('replay import insertion point not found')
          s = s.replace(import_needle, import_needle + "\nimport { rebindReplayAuthorityReferences } from './replay-authority-rebinder.js';", 1)
          pattern = r"(\s*)const rebound = rehydrateReplayValue\(\s*product\.content,\s*currentInput,\s*allowedBindingPaths,\s*\);"
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('replay product insertion point not found')
          indent = m.group(1)
          replacement = (
              f"{indent}const rebound = rebindReplayAuthorityReferences(\n"
              f"{indent}  db,\n"
              f"{indent}  taskMetadata,\n"
              f"{indent}  product.schema,\n"
              f"{indent}  rehydrateReplayValue(\n"
              f"{indent}    product.content,\n"
              f"{indent}    currentInput,\n"
              f"{indent}    allowedBindingPaths,\n"
              f"{indent}  ),\n"
              f"{indent});"
          )
          s = re.sub(pattern, replacement, s, count=1)
          p.write_text(s)
          PY
      - name: Build (strict TypeScript)
        run: npm run build
      - name: Instrument Development replay identity comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/factory-contract/golden-path.test.mjs')
          s = p.read_text()
          needle = "    assertLifecycleOutcomes(resultDb, processRunsAfterA, runB.stderr);"
          replacement = r'''    const devCapsules = resultDb.prepare(`
              SELECT id,replay_key,source_execution_ref,
                     json_extract(payload_snapshot,'$.key.nodeId') AS nodeId,
                     json_extract(payload_snapshot,'$.key.productionCellId') AS cellId,
                     json_extract(payload_snapshot,'$.key.workKey') AS workKey,
                     json_extract(payload_snapshot,'$.key.role') AS role,
                     json_extract(payload_snapshot,'$.key.semanticInputDigest') AS semanticInputDigest,
                     json_extract(payload_snapshot,'$.key.subjectProductionDigest') AS subjectProductionDigest
                FROM factory_replay_capsules
               WHERE json_extract(payload_snapshot,'$.key.moduleRef')='solution-development@1.0.0'
               ORDER BY id
            `).all();
            const devExecutions = resultDb.prepare(`
              SELECT we.execution_id,t.id AS taskId,t.metadata,we.metadata AS executionMetadata
                FROM worker_executions we JOIN tasks t ON t.id=we.task_id
               WHERE json_extract(t.metadata,'$.process_module_ref')='solution-development@1.0.0'
               ORDER BY we.rowid
            `).all().map(row => ({
              executionId: row.execution_id,
              taskId: row.taskId,
              task: JSON.parse(row.metadata || '{}'),
              replay: JSON.parse(row.executionMetadata || '{}').execution_context?.replay || null,
            }));
            process.stderr.write(`DEV_CAPSULES=${JSON.stringify(devCapsules)}\n`);
            process.stderr.write(`DEV_EXECUTIONS=${JSON.stringify(devExecutions)}\n`);
            assertLifecycleOutcomes(resultDb, processRunsAfterA, runB.stderr);'''
          if needle not in s:
              raise SystemExit('diagnostic insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Canonical cold plus replay theorem
        run: node --test tests/factory-contract/golden-path.test.mjs

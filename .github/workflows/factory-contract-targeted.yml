name: Factory Contract Targeted

on:
  push:
    branches: [agent/replay-zero-scripted-final]
  pull_request:
    branches: [saga4]
  workflow_dispatch:

jobs:
  canonical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply replay fixes under validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/infrastructure/replay/capsule-replay-executor.ts'); s=p.read_text()
          old="import { deserializeWorkplaceRef } from '../../process-modules/domain/workplace/workplace-ref.js';"
          s=s.replace(old,old+"\nimport { rebindReplayAuthorityReferences } from './replay-authority-rebinder.js';",1)
          pat=r"(\s*)const rebound = rehydrateReplayValue\(\s*product\.content,\s*currentInput,\s*allowedBindingPaths,\s*\);"; m=re.search(pat,s)
          if not m: raise SystemExit('replay insertion missing')
          i=m.group(1); rep=f"{i}const rebound = rebindReplayAuthorityReferences(\n{i}  db,\n{i}  taskMetadata,\n{i}  product.schema,\n{i}  rehydrateReplayValue(\n{i}    product.content,\n{i}    currentInput,\n{i}    allowedBindingPaths,\n{i}  ),\n{i});"
          p.write_text(re.sub(pat,rep,s,count=1))

          p=Path('src/modules/development/application/development-installation.ts'); s=p.read_text()
          a='''          contentHash: materialized.reference.hash,\n          bindings: {\n            graphHash: materialized.graph.graphHash,'''
          b='''          contentHash: materialized.reference.hash,\n          semanticDigest: sha256Hex({\n            schema: DEVELOPMENT_TASK_GRAPH_SCHEMA,\n            acceptanceBaselineHash: developmentCase.acceptanceBaselineHash,\n            acceptanceCriteria: developmentCase.acceptanceCriteria,\n            repositories: developmentCase.repositories,\n            implementationItems: materialized.graph.implementationItems,\n            verificationItems: materialized.graph.verificationItems,\n            integrationTargets: materialized.graph.integrationTargets,\n          }),\n          bindings: {\n            graphHash: materialized.graph.graphHash,'''
          if a not in s: raise SystemExit('taskgraph insertion missing')
          s=s.replace(a,b,1)
          a='''        contentHash: result.reference.hash,\n        bindings: {\n          candidate: result.candidate,'''
          b='''        contentHash: result.reference.hash,\n        semanticDigest: sha256Hex({\n          schema: INTEGRATED_CANDIDATE_SCHEMA,\n          frozen: result.candidate.frozen,\n          repositories: result.candidate.repositories,\n          buildProducts: result.candidate.buildProducts,\n        }),\n        bindings: {\n          candidate: result.candidate,'''
          if a not in s: raise SystemExit('candidate insertion missing')
          p.write_text(s.replace(a,b,1))

          p=Path('src/process-modules/application/generic-flow-executor.ts'); s=p.read_text()
          a='''    const flow = module.flow;\n    const allRuns = nodeRunRepo.list(context.processRunId);\n    // throws V2_WIRING_REQUIRED / NODE_RUN_REPO_V2_REQUIRED on misconfiguration\n    // instead of silently degrading to the v1 path.\n    const v2 = this.resolveV2Channel(nodeRunRepo);'''
          b='''    const flow = module.flow;\n    const v2 = this.resolveV2Channel(nodeRunRepo);\n    const allRuns = v2.repo.listV2(context.processRunId);'''
          if a not in s: raise SystemExit('frame insertion missing')
          s=s.replace(a,b,1)
          a='    const lastCompletedForChain = nodeRunRepo.readLastCompleted(context.processRunId);'
          b='''    const lastCompletedForChain =\n      v2.repo.readLastCompletedV2(context.processRunId)\n      ?? nodeRunRepo.readLastCompleted(context.processRunId);'''
          if a not in s: raise SystemExit('resume insertion missing')
          s=s.replace(a,b,1)
          a='''    executionReceipt: Record<string, unknown> | null;\n  }[],'''; b='''    executionReceipt: Record<string, unknown> | null;\n    semanticDigest?: string | null;\n  }[],'''
          if a not in s: raise SystemExit('frame type insertion missing')
          p.write_text(s.replace(a,b,1))

          p=Path('src/process-modules/application/node-executors/production-cell-node-executor.ts'); s=p.read_text()
          a='''    return sha256Hex({\n      upstreamSemanticDigest,\n      itemId: workplace.itemId,\n      itemDigest: sha256Hex(workplace.item),\n    });'''
          b='''    const inputRecord = isRecord(ctx.input) ? ctx.input : null;\n    const immediateUpstream = inputRecord ? readInputAsProduction(inputRecord.upstream) : null;\n    const immediateUpstreamSemanticDigest = immediateUpstream\n      ? (immediateUpstream.semanticDigest ?? immediateUpstream.contentHash)\n      : null;\n    return sha256Hex({\n      upstreamSemanticDigest,\n      immediateUpstreamSemanticDigest:\n        immediateUpstreamSemanticDigest === upstreamSemanticDigest ? null : immediateUpstreamSemanticDigest,\n      itemId: workplace.itemId,\n      itemDigest: sha256Hex(workplace.item),\n    });'''
          if a not in s: raise SystemExit('fanout insertion missing')
          p.write_text(s.replace(a,b,1))

          p=Path('tests/factory-contract/scenario-scripted-executor.mjs'); s=p.read_text()
          s=s.replace('function runCapsuleReplay(dbPath, assignment) {','function runCapsuleReplay(dbPath, assignment, workspaceRoot) {',1)
          s=s.replace("  const cwd = assignment?.executionContext?.repository_desk?.execution_path || process.cwd();","  const cwd = assignment?.executionContext?.repository_desk?.execution_path || workspaceRoot || process.cwd();",1)
          s=s.replace('            runCapsuleReplay(context.dbPath, assignment);','            runCapsuleReplay(context.dbPath, assignment, context.workspaceRoot);',1)
          p.write_text(s)

          p=Path('tests/factory-contract/scenario-composition.mjs'); s=p.read_text()
          a='  const releaseStateRoot = env.SAGA_BUTTON_REPO_PATH || cwd;'
          b="  const releaseStateRoot = path.join(env.SAGA_BUTTON_REPO_PATH || cwd, '.git');"
          if a not in s: raise SystemExit('release state insertion missing')
          p.write_text(s.replace(a,b,1))
          PY
      - name: Build (strict TypeScript)
        run: npm run build
      - name: Canonical cold plus replay theorem
        run: node --test tests/factory-contract/golden-path.test.mjs

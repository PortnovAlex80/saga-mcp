name: Factory Contract Targeted

on:
  push:
    branches:
      - agent/replay-zero-scripted-final
  pull_request:
    branches:
      - saga4
  workflow_dispatch:

jobs:
  canonical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply replay fixes under validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/infrastructure/replay/capsule-replay-executor.ts')
          s = p.read_text()
          import_needle = "import { deserializeWorkplaceRef } from '../../process-modules/domain/workplace/workplace-ref.js';"
          s = s.replace(import_needle, import_needle + "\nimport { rebindReplayAuthorityReferences } from './replay-authority-rebinder.js';", 1)
          pattern = r"(\s*)const rebound = rehydrateReplayValue\(\s*product\.content,\s*currentInput,\s*allowedBindingPaths,\s*\);"
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('replay product insertion point not found')
          indent = m.group(1)
          replacement = (
              f"{indent}const rebound = rebindReplayAuthorityReferences(\n"
              f"{indent}  db,\n"
              f"{indent}  taskMetadata,\n"
              f"{indent}  product.schema,\n"
              f"{indent}  rehydrateReplayValue(\n"
              f"{indent}    product.content,\n"
              f"{indent}    currentInput,\n"
              f"{indent}    allowedBindingPaths,\n"
              f"{indent}  ),\n"
              f"{indent});"
          )
          p.write_text(re.sub(pattern, replacement, s, count=1))

          p = Path('src/modules/development/application/development-installation.ts')
          s = p.read_text()
          taskgraph_needle = '''          contentHash: materialized.reference.hash,\n          bindings: {\n            graphHash: materialized.graph.graphHash,'''
          taskgraph_replacement = '''          contentHash: materialized.reference.hash,\n          semanticDigest: sha256Hex({\n            schema: DEVELOPMENT_TASK_GRAPH_SCHEMA,\n            acceptanceBaselineHash: developmentCase.acceptanceBaselineHash,\n            acceptanceCriteria: developmentCase.acceptanceCriteria,\n            repositories: developmentCase.repositories,\n            implementationItems: materialized.graph.implementationItems,\n            verificationItems: materialized.graph.verificationItems,\n            integrationTargets: materialized.graph.integrationTargets,\n          }),\n          bindings: {\n            graphHash: materialized.graph.graphHash,'''
          if taskgraph_needle not in s:
              raise SystemExit('taskgraph semantic insertion point not found')
          s = s.replace(taskgraph_needle, taskgraph_replacement, 1)
          frozen_needle = '''        contentHash: result.reference.hash,\n        bindings: {\n          candidate: result.candidate,'''
          frozen_replacement = '''        contentHash: result.reference.hash,\n        semanticDigest: sha256Hex({\n          schema: INTEGRATED_CANDIDATE_SCHEMA,\n          frozen: result.candidate.frozen,\n          repositories: result.candidate.repositories,\n          buildProducts: result.candidate.buildProducts,\n        }),\n        bindings: {\n          candidate: result.candidate,'''
          if frozen_needle not in s:
              raise SystemExit('integrated candidate semantic insertion point not found')
          p.write_text(s.replace(frozen_needle, frozen_replacement, 1))

          p = Path('src/process-modules/application/node-executors/production-cell-node-executor.ts')
          s = p.read_text()
          fanout_needle = '''    return sha256Hex({\n      upstreamSemanticDigest,\n      itemId: workplace.itemId,\n      itemDigest: sha256Hex(workplace.item),\n    });'''
          fanout_replacement = '''    const inputRecord = isRecord(ctx.input) ? ctx.input : null;\n    const immediateUpstream = inputRecord\n      ? readInputAsProduction(inputRecord.upstream)\n      : null;\n    const immediateUpstreamSemanticDigest = immediateUpstream\n      ? (immediateUpstream.semanticDigest ?? immediateUpstream.contentHash)\n      : null;\n    return sha256Hex({\n      upstreamSemanticDigest,\n      immediateUpstreamSemanticDigest:\n        immediateUpstreamSemanticDigest === upstreamSemanticDigest\n          ? null\n          : immediateUpstreamSemanticDigest,\n      itemId: workplace.itemId,\n      itemDigest: sha256Hex(workplace.item),\n    });'''
          if fanout_needle not in s:
              raise SystemExit('fanout semantic insertion point not found')
          p.write_text(s.replace(fanout_needle, fanout_replacement, 1))
          PY
      - name: Build (strict TypeScript)
        run: npm run build
      - name: Canonical cold plus replay theorem
        run: node --test tests/factory-contract/golden-path.test.mjs

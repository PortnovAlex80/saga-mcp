name: Factory Contract Targeted

on:
  push:
    branches:
      - agent/replay-zero-scripted-final
  pull_request:
    branches:
      - saga4
  workflow_dispatch:

jobs:
  canonical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply replay authority rebinding experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/infrastructure/replay/capsule-replay-executor.ts')
          s = p.read_text()
          import_needle = "import { deserializeWorkplaceRef } from '../../process-modules/domain/workplace/workplace-ref.js';"
          if import_needle not in s:
              raise SystemExit('replay import insertion point not found')
          s = s.replace(import_needle, import_needle + "\nimport { rebindReplayAuthorityReferences } from './replay-authority-rebinder.js';", 1)
          pattern = r"(\s*)const rebound = rehydrateReplayValue\(\s*product\.content,\s*currentInput,\s*allowedBindingPaths,\s*\);"
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('replay product insertion point not found')
          indent = m.group(1)
          replacement = (
              f"{indent}const rebound = rebindReplayAuthorityReferences(\n"
              f"{indent}  db,\n"
              f"{indent}  taskMetadata,\n"
              f"{indent}  rehydrateReplayValue(\n"
              f"{indent}    product.content,\n"
              f"{indent}    currentInput,\n"
              f"{indent}    allowedBindingPaths,\n"
              f"{indent}  ),\n"
              f"{indent});"
          )
          s = re.sub(pattern, replacement, s, count=1)
          p.write_text(s)
          PY
      - name: Build (strict TypeScript)
        run: npm run build
      - name: Instrument Run B replay classification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/factory-contract/golden-path.test.mjs')
          s = p.read_text()
          needle = "    assertLifecycleOutcomes(resultDb, processRunsAfterA, runB.stderr);"
          replacement = r'''    const runBRunIds = resultDb.prepare(
              'SELECT id FROM factory_process_runs ORDER BY id LIMIT -1 OFFSET ?',
            ).all(processRunsAfterA).map(row => row.id);
            const runBExecutions = runBRunIds.length === 0 ? [] : resultDb.prepare(
              `SELECT we.execution_id,we.task_id,we.state,we.exit_code,we.metadata,t.metadata AS task_metadata
                 FROM worker_executions we JOIN tasks t ON t.id=we.task_id
                WHERE CAST(json_extract(t.metadata,'$.process_run_id') AS INTEGER) IN (${runBRunIds.map(() => '?').join(',')})
                ORDER BY we.rowid`,
            ).all(...runBRunIds).map(row => {
              const executionMeta = JSON.parse(row.metadata || '{}');
              const taskMeta = JSON.parse(row.task_metadata || '{}');
              const replay = executionMeta.execution_context?.replay || {};
              const matchingCapsules = replay.key
                ? resultDb.prepare('SELECT capsule_ref,source_execution_ref FROM factory_replay_capsules WHERE replay_key=? ORDER BY id').all(replay.key)
                : [];
              return {
                executionId: row.execution_id,
                taskId: row.task_id,
                module: taskMeta.process_module_ref,
                node: taskMeta.process_node_id,
                cell: taskMeta.production_cell_id,
                role: taskMeta.role,
                workKey: taskMeta.work_key,
                semanticInputDigest: taskMeta.semantic_input_digest,
                state: row.state,
                exitCode: row.exit_code,
                replayKey: replay.key || null,
                keyMaterial: replay.key_material || null,
                frozenCapsuleRef: replay.capsule_ref || null,
                matchingCapsules,
              };
            });
            process.stderr.write(`RUN_B_REPLAY_CLASSIFICATION=${JSON.stringify(runBExecutions)}\n`);
            assertLifecycleOutcomes(resultDb, processRunsAfterA, runB.stderr);'''
          if needle not in s:
              raise SystemExit('diagnostic insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Canonical cold plus replay theorem
        run: node --test tests/factory-contract/golden-path.test.mjs

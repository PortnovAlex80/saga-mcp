name: Export Saga4 signature fix files

on:
  pull_request:
    branches:
      - saga4

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saga4
      - name: Pack fixed files
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/saga4-signature-fix-files.tgz \
            src/process-modules/modules/delivery/delivery-installation.ts \
            src/process-modules/modules/delivery/delivery-kernel-ports.ts \
            src/process-modules/modules/delivery/sqlite-delivery-runtime.ts \
            tests/process-modules/delivery-lifecycle-resume.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: saga4-signature-fix-files
          path: /tmp/saga4-signature-fix-files.tgz
          retention-days: 1
